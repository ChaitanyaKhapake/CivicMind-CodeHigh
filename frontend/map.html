<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>City map · CivicMind</title>
<link rel="icon" href="assets/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<header class="nav" id="nav"></header>

<div class="map-shell">
  <section class="map-overlay" aria-label="Map filters">
    <div class="row spread" style="margin-bottom:10px">
      <strong id="mapTitle">City map</strong>
      <button class="btn sm ghost" id="panelToggle" aria-expanded="true" aria-controls="panelBody">Hide</button>
    </div>
    <div id="panelBody">
      <p class="tiny muted" id="scopeNote"></p>
      <div class="field" style="margin-bottom:10px">
        <label class="f" for="fCategory">Category</label>
        <select id="fCategory"><option value="">All categories</option></select>
      </div>
      <div class="field" style="margin-bottom:10px">
        <label class="f" for="fStatus">Report status</label>
        <select id="fStatus"><option value="">Any</option><option value="open">Open (not resolved)</option>
          <option value="submitted">Submitted</option><option value="clustered">Grouped</option>
          <option value="in_progress">In progress</option><option value="resolved">Resolved</option></select>
      </div>
      <fieldset class="layers">
        <legend class="f">Layers</legend>
        <label><input type="checkbox" id="layComplaints" checked/> Reports <strong id="cCount">0</strong></label>
        <label><input type="checkbox" id="layIncidents" checked/> Incidents <strong id="iCount">0</strong></label>
        <label class="staff-only"><input type="checkbox" id="layAssets" checked/> Infrastructure assets <strong id="aCount">0</strong></label>
        <label class="staff-only"><input type="checkbox" id="layFindings" checked/> Risk findings <strong id="fCount">0</strong></label>
        <label class="staff-only"><input type="checkbox" id="layPriority"/> Only High/Critical incidents</label>
      </fieldset>
      <div class="row spread" style="margin-top:10px">
        <span class="tiny muted" id="updated">Loading…</span>
        <button class="btn sm" id="refreshBtn">↻ Refresh</button>
      </div>
      <div class="notice warn tiny" id="tileWarn" hidden>Map tiles failed to load — markers are still shown.</div>
    </div>
  </section>

  <section class="map-legend" aria-label="Legend">
    <div class="legend-title">Reports (by severity)</div>
    <div class="lrow"><span class="swatch round" style="background:#2E9E5B"></span>1–2 low</div>
    <div class="lrow"><span class="swatch round" style="background:#E0A106"></span>3 moderate</div>
    <div class="lrow"><span class="swatch round" style="background:#D9342B"></span>4–5 high</div>
    <div class="legend-title">Incidents (by priority)</div>
    <div class="lrow"><span class="swatch pill" style="background:#D9342B">⚠ n</span>count of reports</div>
    <div class="staff-only">
      <div class="legend-title">Infrastructure</div>
      <div class="lrow"><span class="swatch diamond" style="background:#2F6FDB"></span>asset</div>
      <div class="lrow"><span class="swatch diamond" style="background:#7B4FD1"></span>critical asset</div>
      <div class="lrow"><span class="swatch flag">🚩</span>risk finding</div>
    </div>
  </section>

  <div id="map" role="application" aria-label="City map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/map.js"></script>
</body>
</html>
