# Render blueprint — CivicMind as a Docker web service. Deploy only when you intend to publish it.
# A persistent disk is REQUIRED for real use: without it the SQLite database and uploaded
# photos/videos are lost on every redeploy or restart (Render's free plan has no disks).
services:
  - type: web
    name: civicmind
    runtime: docker
    plan: starter               # disks need a paid plan
    healthCheckPath: /api/health
    disk:
      name: civicmind-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: CIVICMIND_ENV
        value: production
      - key: CIVICMIND_SECRET
        generateValue: true     # long random value, created once by Render
      - key: CIVICMIND_ADMIN_EMAIL
        sync: false             # creates this admin on first start if missing
      - key: CIVICMIND_ADMIN_PASSWORD
        sync: false             # >= 12 characters; remove after the first start
      - key: SARVAM_API_KEY
        sync: false             # optional: AI classification, chatbot phrasing, speech-to-text
      - key: TINYFISH_API_KEY
        sync: false             # optional: public data-source discovery for admins
      - key: CIVICMIND_REVERSE_GEOCODER
        value: none             # "nominatim" only within the Nominatim usage policy (see .env.example)
